app:
  id: ari:cloud:ecosystem::app/invalid-run-forge-register
  runtime:
    name: nodejs22.x

remotes:
  - key: connect
    baseUrl: https://connectie-vnguyen5.public.atlastunnel.com

modules:
  devops:designInfoProvider:
    - key: figma-design-info-provider
      name:
        value: Figma
      homeUrl: https://www.figma.com/
      logoUrl: https://connectie-vnguyen5.public.atlastunnel.com/static/figma-logo.svg
      documentationUrl: https://help.figma.com/hc/en-us/articles/360039827834-Jira-and-Figma
      handledDomainName: figma.com
      actions:
        getEntityByUrl:
          endpoint: connect
          path: /entities/getEntityByUrl
        onEntityAssociated:
          endpoint: connect
          path: /entities/onEntityAssociated
        onEntityDisassociated:
          endpoint: connect
          path: /entities/onEntityDisassociated
        checkAuth:
          endpoint: connect
          path: /auth/checkAuth

  jira:adminPage:
    - key: figma-admin-page
      title: Figma for Jira
      resource: admin-ui
      resolver:
        endpoint: connect
      useAsConfig: true

  preUninstall:
    - key: figma-pre-uninstall
      function: pre-uninstall-handler

  function:
    - key: pre-uninstall-handler
      handler: src/forge/pre-uninstall.handler

resources:
  - key: admin-ui
    path: admin/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - delete:jira-work
  external:
    fetch:
      backend:
        - api.figma.com
        - connectie-vnguyen5.public.atlastunnel.com
