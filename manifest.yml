app:
  id: ari:cloud:ecosystem::app/108fb5e5-ffcc-4ee5-bcaf-358e52d69aef
  runtime:
    name: nodejs22.x

remotes:
  - key: connect
    baseUrl: https://connectie-vnguyen5.public.atlastunnel.com
    # We make outbound calls to Atlassian APIs (Jira) using the appSystemToken,
    # which is "compute". We also persist EUD (Figma file webhook + design data)
    # in our own Postgres on the remote — that's "storage".
    operations:
      - compute
      - storage
    storage:
      # We DO store in-scope End-User Data on the remote (Figma webhook
      # records, design associations, OAuth credentials, etc).
      inScopeEUD: true
    auth:
      appSystemToken:
        enabled: true

modules:
  devops:designInfoProvider:
    - key: figma-design-info-provider
      name:
        value: Figma
      homeUrl: https://www.figma.com/
      logoUrl: https://connectie-vnguyen5.public.atlastunnel.com/static/figma-logo.svg
      documentationUrl: https://help.figma.com/hc/en-us/articles/360039827834-Jira-and-Figma
      handledDomainName: figma.com
      actions:
        getEntityByUrl:
          endpoint: connect
          path: /entities/getEntityByUrl
        onEntityAssociated:
          endpoint: connect
          path: /entities/onEntityAssociated
        onEntityDisassociated:
          endpoint: connect
          path: /entities/onEntityDisassociated
        checkAuth:
          endpoint: connect
          path: /auth/checkAuth

  jira:adminPage:
    - key: figma-admin-page
      title: Figma for Jira
      resource: admin-ui
      # No `resolver` is declared because this Custom UI does not use
      # `invoke()` from `@forge/bridge`. It calls the remote backend
      # directly via `requestRemote('connect', ...)`, which uses the
      # `remotes` block above.
      useAsConfig: true

  preUninstall:
    - key: figma-pre-uninstall
      function: pre-uninstall-fn

  scheduledTrigger:
    - key: figma-refresh-app-tokens
      function: refresh-tokens-fn
      # Run hourly per installation. Each invocation receives a fresh
      # `x-forge-oauth-system` header for that installation, which the
      # handler persists to the `jira_app_token` table for use by the
      # Figma webhook flow (which has no inbound FIT of its own).
      # Valid intervals per Forge docs: fiveMinute, hour, day, week.
      interval: hour

  function:
    # NB: Forge function keys must be 23 chars or fewer.
    # The handler points at src/index.ts named exports. See src/index.ts
    # for why we route through a single entry point.
    - key: pre-uninstall-fn
      handler: index.preUninstall
    - key: refresh-tokens-fn
      handler: index.refreshAppTokens

resources:
  - key: admin-ui
    path: admin/dist

permissions:
  scopes:
    # Required for: GET /rest/api/3/issue and POST /rest/api/3/permissions/check
    - read:jira-work
    # Required (Beta; future-mandatory) for: PUT/DELETE /rest/forge/1/app/properties/*
    - write:app-data:jira
    # Required to receive the x-forge-oauth-system header on inbound calls
    - read:app-system-token
    # Note: scope for POST /rest/designs/1.0/bulk (submit designs) is unverified
    # — see MIGRATION_PLAN.md "Open questions" for Phase 5.
  external:
    fetch:
      backend:
        # Outbound to Figma's REST API
        - address: "https://api.figma.com"
          inScopeEUD: true
        # Outbound to our own remote backend (matches the `remotes` key)
        - remote: connect
